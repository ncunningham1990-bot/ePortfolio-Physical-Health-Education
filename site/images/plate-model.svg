<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Balanced plate model</title><desc id="d">A plate split into fruit and vegetables, starchy foods, protein, dairy and oils.</desc>
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >A balanced plate (approximate proportions)</text><circle cx="290" cy="255" r="204" fill="#fff" stroke="#9ca3af" stroke-width="4" /><circle cx="290" cy="255" r="190" fill="#f8fafc" stroke="#d1d5db" stroke-width="2" /><path d="M290,255 L290.0,65.0 A190,190 0 0 1 407.0,404.7 Z" fill="#86efac" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="394.1961470310447" y="231.1" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🥦🍎</text><path d="M290,255 L407.0,404.7 A190,190 0 0 1 101.8,281.4 Z" fill="#fde68a" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="248.7183534055665" y="369.2" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🍞🍚</text><path d="M290,255 L101.8,281.4 A190,190 0 0 1 181.0,99.4 Z" fill="#fca5a5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="188.93997980275935" y="223.1" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🍗🐟🥚</text><path d="M290,255 L181.0,99.4 A190,190 0 0 1 290.0,65.0 Z" fill="#bfdbfe" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="256.8622208946291" y="161.9" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🥛🧀</text><circle cx="290" cy="255" r="16" fill="#fff" stroke="#d1d5db" stroke-width="1" /><rect x="540" y="100" width="22" height="22" rx="4" fill="#86efac" stroke="#0b0f0c" stroke-width="1.5" /><text x="572" y="117.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Fruit &amp; vegetables</text><text x="572" y="138.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >just over ⅓</text><rect x="540" y="162" width="22" height="22" rx="4" fill="#fde68a" stroke="#0b0f0c" stroke-width="1.5" /><text x="572" y="179.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Starchy carbohydrates</text><text x="572" y="200.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >about ⅓</text><rect x="540" y="224" width="22" height="22" rx="4" fill="#fca5a5" stroke="#0b0f0c" stroke-width="1.5" /><text x="572" y="241.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Protein foods</text><text x="572" y="262.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >about ⅙</text><rect x="540" y="286" width="22" height="22" rx="4" fill="#bfdbfe" stroke="#0b0f0c" stroke-width="1.5" /><text x="572" y="303.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Dairy or alternatives</text><text x="572" y="324.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >small</text><rect x="540" y="348" width="22" height="22" rx="4" fill="#fef3c7" stroke="#0b0f0c" stroke-width="1.5" /><text x="572" y="365.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Oils &amp; spreads</text><text x="572" y="386.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >tiny amounts, choose unsaturated</text><text x="540" y="438.0" font-size="16" text-anchor="start" font-weight="700" fill="#0b0f0c"  >💧 Drink water through the day</text><text x="540" y="466.0" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >Foods high in fat, salt and sugar:</text><text x="540" y="482.8" font-size="14" text-anchor="start" font-weight="400" fill="#6b7a70"  >enjoy only now and then</text>
</svg>
