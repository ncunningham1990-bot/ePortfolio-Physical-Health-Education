<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Elements of a training session</title><desc id="d">A timeline: warm-up, endurance training, resistance training and cool-down.</desc>
<rect width="900" height="340" fill="#fff"/>
<text x="450" y="34.0" font-size="22" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Elements of a general training session</text><rect x="40" y="80" width="130" height="120" rx="6" fill="#22c55e" stroke="#0b0f0c" stroke-width="2" /><text x="105.0" y="135.0" font-size="17" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Warm-up</text><text x="105.0" y="165.0" font-size="15" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >10 min</text><rect x="180" y="80" width="260" height="120" rx="6" fill="#15803d" stroke="#0b0f0c" stroke-width="2" /><text x="310.0" y="135.0" font-size="17" text-anchor="middle" font-weight="800" fill="#fff"  >Endurance training</text><text x="310.0" y="165.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff"  >20 min</text><rect x="450" y="80" width="260" height="120" rx="6" fill="#f59e0b" stroke="#0b0f0c" stroke-width="2" /><text x="580.0" y="135.0" font-size="17" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Resistance training</text><text x="580.0" y="165.0" font-size="15" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >20 min</text><rect x="720" y="80" width="130" height="120" rx="6" fill="#dc2626" stroke="#0b0f0c" stroke-width="2" /><text x="785.0" y="135.0" font-size="17" text-anchor="middle" font-weight="800" fill="#fff"  >Cool-down</text><text x="785.0" y="165.0" font-size="15" text-anchor="middle" font-weight="600" fill="#fff"  >10 min</text><text x="450" y="245.0" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Example 60-minute session (timings are a guide)</text><text x="105" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >pulse raiser,</text><text x="105" y="306.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >mobility, dynamic</text><text x="105" y="323.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >stretches</text><text x="310" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >continuous, interval or</text><text x="310" y="306.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >fartlek work</text><text x="580" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >circuits, bodyweight</text><text x="580" y="306.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >or weights</text><text x="785" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >slow jog/walk,</text><text x="785" y="306.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >static stretching</text>
</svg>
