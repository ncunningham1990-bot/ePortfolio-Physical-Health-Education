<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Slow and fast twitch fibres</title><desc id="d">Comparison bars for slow twitch and fast twitch muscle fibres.</desc>
<rect width="900" height="370" fill="#fff"/>
<text x="450" y="32.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Muscle fibre types</text><rect x="30" y="52" width="410" height="300" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="235" y="86.0" font-size="22" text-anchor="middle" font-weight="800" fill="#dc2626"  >Slow twitch (Type I)</text><text x="235" y="108.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >red fibres</text><text x="50" y="138.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Contraction speed</text><rect x="50" y="146" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="50" y="146" width="111.0" height="16" rx="8" fill="#dc2626" stroke="none" stroke-width="0" /><text x="50" y="186.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Force produced</text><rect x="50" y="194" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="50" y="194" width="111.0" height="16" rx="8" fill="#dc2626" stroke="none" stroke-width="0" /><text x="50" y="234.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Resistance to fatigue</text><rect x="50" y="242" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="50" y="242" width="340.4" height="16" rx="8" fill="#dc2626" stroke="none" stroke-width="0" /><text x="50" y="282.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Use of oxygen (aerobic)</text><rect x="50" y="290" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="50" y="290" width="340.4" height="16" rx="8" fill="#dc2626" stroke="none" stroke-width="0" /><text x="235" y="335.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Best for: marathon running, posture muscles</text><rect x="470" y="52" width="410" height="300" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="675" y="86.0" font-size="22" text-anchor="middle" font-weight="800" fill="#6b7280"  >Fast twitch (Type II)</text><text x="675" y="108.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >white/pale fibres</text><text x="490" y="138.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Contraction speed</text><rect x="490" y="146" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="490" y="146" width="340.4" height="16" rx="8" fill="#6b7280" stroke="none" stroke-width="0" /><text x="490" y="186.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Force produced</text><rect x="490" y="194" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="490" y="194" width="340.4" height="16" rx="8" fill="#6b7280" stroke="none" stroke-width="0" /><text x="490" y="234.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Resistance to fatigue</text><rect x="490" y="242" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="490" y="242" width="103.6" height="16" rx="8" fill="#6b7280" stroke="none" stroke-width="0" /><text x="490" y="282.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Use of oxygen (aerobic)</text><rect x="490" y="290" width="370" height="16" rx="8" fill="#e5e7eb" stroke="none" stroke-width="0" /><rect x="490" y="290" width="111.0" height="16" rx="8" fill="#6b7280" stroke="none" stroke-width="0" /><text x="675" y="335.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Best for: sprinting, throwing, jumping</text>
</svg>
