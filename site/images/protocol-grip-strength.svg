<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Grip strength test</title><desc id="d">A hand dynamometer used to measure grip strength in kilograms.</desc>
<rect width="900" height="470" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Grip strength dynamometer test</text><rect x="330" y="120" width="240" height="100" rx="20" fill="#e5e7eb" stroke="#0b0f0c" stroke-width="3" /><ellipse cx="450" cy="170" rx="70" ry="28" fill="#fff" stroke="#0b0f0c" stroke-width="2" /><text x="450" y="176.0" font-size="22" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >kg</text><path d="M330,200 Q300,260 380,270 L520,270 Q600,260 570,200" fill="#d1d5db" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="450" y="320.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Squeeze as hard as possible for about 3 seconds</text><rect x="60" y="345" width="780" height="105" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="80" y="373.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Stand with the arm hanging by your side, elbow straight, not touching the body. Squeeze the handle</text><text x="80" y="397.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >as hard as you can. Record the reading in kg. Do 2-3 attempts on each hand and use your best.</text><text x="80" y="421.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Measures: muscular strength (hand and forearm).</text>
</svg>
