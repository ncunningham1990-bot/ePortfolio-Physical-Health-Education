<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Micronutrients, fibre and water</title><desc id="d">Six tiles giving the job of each nutrient and example foods.</desc>
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Vitamins, minerals, fibre and water</text><rect x="20" y="56" width="270" height="205" rx="12" fill="#fafafa" stroke="#15803d" stroke-width="2" /><text x="155" y="90.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Calcium</text><text x="155" y="144.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🥛</text><text x="155" y="184.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Strong bones and teeth</text><text x="155" y="224.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Sources: milk, cheese, yoghurt, leafy greens</text><rect x="310" y="56" width="270" height="205" rx="12" fill="#fafafa" stroke="#15803d" stroke-width="2" /><text x="445" y="90.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Iron</text><text x="445" y="144.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🥩</text><text x="445" y="184.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Carries oxygen in blood</text><text x="445" y="224.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Sources: red meat, beans, spinach</text><rect x="600" y="56" width="270" height="205" rx="12" fill="#fafafa" stroke="#15803d" stroke-width="2" /><text x="735" y="90.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Vitamin C</text><text x="735" y="144.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🍊</text><text x="735" y="184.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Healing and immunity</text><text x="735" y="224.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Sources: citrus fruit, peppers, berries</text><rect x="20" y="276" width="270" height="205" rx="12" fill="#fafafa" stroke="#15803d" stroke-width="2" /><text x="155" y="310.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Vitamin D</text><text x="155" y="364.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >☀️</text><text x="155" y="404.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Helps absorb calcium</text><text x="155" y="444.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Sources: sunlight, oily fish, eggs</text><rect x="310" y="276" width="270" height="205" rx="12" fill="#fafafa" stroke="#15803d" stroke-width="2" /><text x="445" y="310.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Fibre</text><text x="445" y="364.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🌾</text><text x="445" y="404.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Healthy digestion</text><text x="445" y="444.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Sources: wholegrains, fruit, vegetables, beans</text><rect x="600" y="276" width="270" height="205" rx="12" fill="#fafafa" stroke="#15803d" stroke-width="2" /><text x="735" y="310.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Water</text><text x="735" y="364.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >💧</text><text x="735" y="404.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Temperature, transport,</text><text x="735" y="421.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >lubrication</text><text x="735" y="444.0" font-size="12" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Sources: water, milk, fruit and vegetables</text>
</svg>
