<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Ruler drop test</title><desc id="d">A ruler dropping between a person&#x27;s open thumb and finger.</desc>
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Ruler drop test</text><rect x="420" y="60" width="40" height="300" rx="3" fill="#fde68a" stroke="#0b0f0c" stroke-width="2" /><line x1="420" y1="60" x2="442" y2="60" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="70" x2="432" y2="70" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="80" x2="432" y2="80" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="90" x2="432" y2="90" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="100" x2="432" y2="100" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="110" x2="442" y2="110" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><text x="452" y="114.0" font-size="11" text-anchor="end" font-weight="normal" fill="#0b0f0c"  >5</text><line x1="420" y1="120" x2="432" y2="120" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="130" x2="432" y2="130" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="140" x2="432" y2="140" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="150" x2="432" y2="150" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="160" x2="442" y2="160" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><text x="452" y="164.0" font-size="11" text-anchor="end" font-weight="normal" fill="#0b0f0c"  >10</text><line x1="420" y1="170" x2="432" y2="170" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="180" x2="432" y2="180" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="190" x2="432" y2="190" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="200" x2="432" y2="200" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="210" x2="442" y2="210" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><text x="452" y="214.0" font-size="11" text-anchor="end" font-weight="normal" fill="#0b0f0c"  >15</text><line x1="420" y1="220" x2="432" y2="220" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="230" x2="432" y2="230" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="240" x2="432" y2="240" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="250" x2="432" y2="250" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="260" x2="442" y2="260" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><text x="452" y="264.0" font-size="11" text-anchor="end" font-weight="normal" fill="#0b0f0c"  >20</text><line x1="420" y1="270" x2="432" y2="270" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="280" x2="432" y2="280" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="290" x2="432" y2="290" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="300" x2="432" y2="300" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="310" x2="442" y2="310" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><text x="452" y="314.0" font-size="11" text-anchor="end" font-weight="normal" fill="#0b0f0c"  >25</text><line x1="420" y1="320" x2="432" y2="320" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="330" x2="432" y2="330" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="340" x2="432" y2="340" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="350" x2="432" y2="350" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><line x1="420" y1="360" x2="442" y2="360" stroke="#0b0f0c" stroke-width="1" stroke-linecap="round" /><text x="452" y="364.0" font-size="11" text-anchor="end" font-weight="normal" fill="#0b0f0c"  >30</text><text x="440" y="52.0" font-size="12" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >0</text><rect x="380" y="320" width="120" height="14" rx="6" fill="#ecc9ae" stroke="#8a5c44" stroke-width="2" /><rect x="380" y="350" width="120" height="14" rx="6" fill="#ecc9ae" stroke="#8a5c44" stroke-width="2" /><text x="540" y="342.0" font-size="15" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Thumb and finger open,</text><text x="540" y="360.0" font-size="15" text-anchor="start" font-weight="600" fill="#0b0f0c"  >ready to catch</text><line x1="560" y1="120" x2="560" y2="215" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" /><polygon points="560,215 554.8,204.2 565.2,204.2" fill="#dc2626"/><text x="580" y="160.0" font-size="15" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Dropped</text><text x="580" y="178.0" font-size="15" text-anchor="start" font-weight="600" fill="#0b0f0c"  >without warning</text><rect x="60" y="395" width="780" height="85" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="80" y="423.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Hold the ruler so the 0 cm mark is level with the top of the tester&#x27;s thumb. Drop it without warning.</text><text x="80" y="447.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >The tester catches it as fast as possible. Record where it was caught: shorter distance = faster</text><text x="80" y="468.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b0f0c"  >reaction time. Measures: reaction time.</text>
</svg>
