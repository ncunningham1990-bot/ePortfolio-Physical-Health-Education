<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">One-minute push-up test</title><desc id="d">Side view of the up and down positions of a push-up.</desc>
<rect width="900" height="480" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >One-minute push-up test</text><line x1="60" y1="300" x2="840" y2="300" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><line x1="170" y1="160" x2="390" y2="195" stroke="#0b0f0c" stroke-width="8" stroke-linecap="round" /><circle cx="148" cy="143" r="15" fill="#fff" stroke="#0b0f0c" stroke-width="5" /><line x1="390" y1="195" x2="470" y2="298" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" /><path d="M180,167 L182,255 L182,298" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="310" y="335.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Up</text><line x1="530" y1="252" x2="750" y2="262" stroke="#0b0f0c" stroke-width="8" stroke-linecap="round" /><circle cx="508" cy="238" r="15" fill="#fff" stroke="#0b0f0c" stroke-width="5" /><line x1="750" y1="262" x2="830" y2="298" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" /><path d="M540,259 L555,278 L542,298" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="670" y="335.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Down</text><rect x="60" y="360" width="780" height="100" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="80" y="388.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Body in a straight line from head to heels. Lower until the elbows reach about 90 degrees, push up.</text><text x="80" y="412.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Count each full, correct push-up in 60 seconds. Stop if your form breaks down (hips sag or rise).</text><text x="80" y="436.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Measures: muscular endurance (arms and chest). Knee push-ups are a modified version.</text>
</svg>
