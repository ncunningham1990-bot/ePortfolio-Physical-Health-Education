<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">The 11 components of fitness</title><desc id="d">Five health-related and six skill-related components of fitness shown as tiles.</desc>
<rect width="900" height="420" fill="#fff"/>
<text x="450" y="40.0" font-size="26" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >The 11 components of fitness</text><rect x="20" y="62" width="860" height="40" rx="8" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="450" y="90.0" font-size="19" text-anchor="middle" font-weight="700" fill="#fff"  >Health-related (5): important for everyone&#x27;s health</text><rect x="20" y="112" width="164" height="120" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="102" y="160.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🫀</text><text x="102" y="186.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Cardiovascular</text><text x="102" y="204.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >endurance</text><rect x="194" y="112" width="164" height="120" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="276" y="160.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >💪</text><text x="276" y="186.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Muscular</text><text x="276" y="204.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >strength</text><rect x="368" y="112" width="164" height="120" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="450" y="160.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🔁</text><text x="450" y="186.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Muscular</text><text x="450" y="204.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >endurance</text><rect x="542" y="112" width="164" height="120" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="624" y="160.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🤸</text><text x="624" y="192.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Flexibility</text><rect x="716" y="112" width="164" height="120" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="798" y="160.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >⚖️</text><text x="798" y="186.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Body</text><text x="798" y="204.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >composition</text><rect x="20" y="250" width="860" height="40" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1" /><text x="450" y="278.0" font-size="19" text-anchor="middle" font-weight="700" fill="#fff"  >Skill-related (6): help you perform in sport</text><rect x="20" y="300" width="135" height="100" rx="10" fill="#f2f5f2" stroke="#dc2626" stroke-width="2" /><text x="87" y="346.0" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >↔️</text><text x="87" y="382.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Agility</text><rect x="165" y="300" width="135" height="100" rx="10" fill="#f2f5f2" stroke="#dc2626" stroke-width="2" /><text x="232" y="346.0" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🧘</text><text x="232" y="382.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Balance</text><rect x="310" y="300" width="135" height="100" rx="10" fill="#f2f5f2" stroke="#dc2626" stroke-width="2" /><text x="377" y="346.0" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🎯</text><text x="377" y="382.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Co-ordination</text><rect x="455" y="300" width="135" height="100" rx="10" fill="#f2f5f2" stroke="#dc2626" stroke-width="2" /><text x="522" y="346.0" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >💥</text><text x="522" y="382.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Power</text><rect x="600" y="300" width="135" height="100" rx="10" fill="#f2f5f2" stroke="#dc2626" stroke-width="2" /><text x="667" y="346.0" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >⚡</text><text x="667" y="382.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Reaction time</text><rect x="745" y="300" width="135" height="100" rx="10" fill="#f2f5f2" stroke="#dc2626" stroke-width="2" /><text x="812" y="346.0" font-size="34" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🏃</text><text x="812" y="382.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Speed</text>
</svg>
