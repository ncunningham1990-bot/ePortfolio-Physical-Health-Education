3,288 512,318 L388,318 Q380.7,288 390,248 Z" fill="#e5e7eb" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="394" y1="178" x2="378" y2="268" stroke="#0b0f0c" stroke-width="9.350000000000001" stroke-linecap="round" /><line x1="419.0" y1="318" x2="415.9" y2="403" stroke="#0b0f0c" stroke-width="17" stroke-linecap="round" /><line x1="506" y1="178" x2="522" y2="268" stroke="#0b0f0c" stroke-width="9.350000000000001" stroke-linecap="round" /><line x1="481.0" y1="318" x2="484.1" y2="403" stroke="#0b0f0c" stroke-width="17" stroke-linecap="round" /><text x="450" y="430.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >muscular, wide shoulders,</text><text x="450" y="446.8" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >athletic build</text><text x="450" y="482.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Suits:</text><text x="450" y="498.2" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >sprinting, gymnastics,</text><text x="450" y="514.4" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >weightlifting</text><rect x="615" y="56" width="270" height="500" rx="12" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="750" y="90.0" font-size="22" text-anchor="middle" font-weight="800" fill="#f59e0b"  >Endomorph</text><circle cx="750" cy="140" r="20" fill="#e5e7eb" stroke="#0b0f0c" stroke-width="3" /><path d="M688,174 Q750,162 812,174 L812,248 Q821.9,288 816,318 L684,318 Q678.1,288 688,248 Z" fill="#e5e7eb" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="682" y1="178" x2="666" y2="268" stroke="#0b0f0c" stroke-width="12.100000000000001" stroke-linecap="round" /><line x1="717.0" y1="318" x2="713.7" y2="403" stroke="#0b0f0c" stroke-width="22" stroke-linecap="round" /><line x1="818" y1="178" x2="834" y2="268" stroke="#0b0f0c" stroke-width="12.100000000000001" stroke-linecap="round" /><line x1="783.0" y1="318" x2="786.3" y2="403" stroke="#0b0f0c" stroke-width="22" stroke-linecap="round" /><text x="750" y="430.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >rounder, wider hips,</text><text x="750" y="446.8" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >higher body fat</text><text x="750" y="482.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Suits:</text><text x="750" y="498.2" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >shot put, sumo wrestling,</text><text x="750" y="514.4" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >prop forward</text>
