<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Inverted-U for fine and gross skills</title><desc id="d">Two inverted-U curves: fine skills peak at lower arousal and gross skills peak at higher arousal.</desc>
<rect width="900" height="460" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Optimal arousal depends on the skill</text><line x1="100" y1="380" x2="800" y2="380" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><line x1="100" y1="380" x2="100" y2="90" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><text x="450.0" y="424.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Arousal (low to high)</text><text transform="translate(44 235.0) rotate(-90)" font-size="17" text-anchor="middle" font-weight="700">Performance</text><path d="M100,360 C190,260 250,100 330,100 C430,100 480,260 680,360" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M160,360 C350,320 480,100 570,100 C660,100 740,290 800,360" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="220" y="66.0" font-size="14.5" text-anchor="middle" font-weight="800" fill="#2563eb"  >Fine skills</text><text x="220" y="83.4" font-size="14.5" text-anchor="middle" font-weight="800" fill="#2563eb"  >(golf putt, archery)</text><text x="690" y="66.0" font-size="14.5" text-anchor="middle" font-weight="800" fill="#dc2626"  >Gross skills</text><text x="690" y="83.4" font-size="14.5" text-anchor="middle" font-weight="800" fill="#dc2626"  >(rugby tackle, shot put)</text><text x="450" y="438.0" font-size="14" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Skills needing precision need lower arousal; powerful, big movements cope with (and need) higher arousal.</text>
</svg>
