<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Physical, mental and social well-being</title><desc id="d">A triangle linking physical, mental and social well-being.</desc>
<rect width="900" height="540" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Health and well-being</text><polygon points="450,130 190,400 710,400" fill="#f8fafc" stroke="#d6d9de" stroke-width="3" stroke-linejoin="round" /><circle cx="450" cy="130" r="64" fill="#15803d" stroke="#15803d" stroke-width="2" fill-opacity="0.18"/><text x="450" y="136.0" font-size="19" text-anchor="middle" font-weight="800" fill="#15803d"  >PHYSICAL</text><text x="534" y="126.0" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >body works well:</text><text x="534" y="143.4" font-size="14.5" text-anchor="start" font-weight="600" fill="#0b0f0c"  >fitness, sleep, nutrition</text><circle cx="190" cy="400" r="64" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.18"/><text x="190" y="406.0" font-size="19" text-anchor="middle" font-weight="800" fill="#dc2626"  >MENTAL</text><text x="190" y="490.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >thoughts and emotions:</text><text x="190" y="507.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >coping with stress, mood</text><circle cx="710" cy="400" r="64" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity="0.18"/><text x="710" y="406.0" font-size="19" text-anchor="middle" font-weight="800" fill="#f59e0b"  >SOCIAL</text><text x="710" y="490.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >relationships and belonging:</text><text x="710" y="507.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >friends, family, teams</text><text x="450" y="320.0" font-size="20" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >HEALTH &amp;</text><text x="450" y="344.0" font-size="20" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >WELL-BEING</text>
</svg>
