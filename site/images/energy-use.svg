<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Daily energy expenditure</title><desc id="d">A stacked bar showing BMR, physical activity and digestion as shares of daily energy use.</desc>
<rect width="900" height="360" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Where does your daily energy go?</text><text x="450" y="58.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Illustrative split for a moderately active teenager</text><rect x="40" y="90" width="492.0" height="90" rx="4" fill="#15803d" stroke="#0b0f0c" stroke-width="2" /><text x="286.0" y="128.0" font-size="18" text-anchor="middle" font-weight="800" fill="#fff"  >BMR</text><text x="286.0" y="156.0" font-size="15" text-anchor="middle" font-weight="700" fill="#fff"  >about 60%</text><text x="286.0" y="212.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0b0f0c"  >keeping the body running at rest</text><text x="286.0" y="228.2" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0b0f0c"  >(breathing, heartbeat, repair)</text><rect x="532.0" y="90" width="246.0" height="90" rx="4" fill="#f59e0b" stroke="#0b0f0c" stroke-width="2" /><text x="655.0" y="128.0" font-size="18" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Physical activity</text><text x="655.0" y="156.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >about 30%</text><text x="655.0" y="212.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0b0f0c"  >movement, sport,</text><text x="655.0" y="228.2" font-size="13.5" text-anchor="middle" font-weight="400" fill="#0b0f0c"  >daily activities</text><rect x="778.0" y="90" width="82.0" height="90" rx="4" fill="#60a5fa" stroke="#0b0f0c" stroke-width="2" /><text x="819.0" y="128.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Digestion</text><text x="819.0" y="156.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >about 10%</text><text x="450" y="300.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Basal metabolic rate (BMR) is the energy your body needs at rest. Activity is the part you can change most.</text><text x="450" y="326.0" font-size="16" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Estimated energy requirement (EER) = BMR × physical activity level (PAL)</text>
</svg>
