<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">RICE injury treatment</title><desc id="d">Four cards for Rest, Ice, Compression and Elevation plus a note on PRICE and PEACE and LOVE.</desc>
<rect width="900" height="480" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Treating a soft-tissue injury: RICE</text><rect x="20" y="56" width="205" height="270" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><circle cx="122" cy="100" r="32" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="122" y="112.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >R</text><text x="122" y="168.0" font-size="21" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Rest</text><text x="122" y="224.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🛑</text><text x="122" y="280.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Stop activity and</text><text x="122" y="296.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >rest the injured part</text><rect x="240" y="56" width="205" height="270" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><circle cx="342" cy="100" r="32" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="342" y="112.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >I</text><text x="342" y="168.0" font-size="21" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Ice</text><text x="342" y="224.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🧊</text><text x="342" y="280.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Cold pack (wrapped)</text><text x="342" y="296.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >10-20 minutes at a time</text><rect x="460" y="56" width="205" height="270" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><circle cx="562" cy="100" r="32" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="562" y="112.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >C</text><text x="562" y="168.0" font-size="21" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Compression</text><text x="562" y="224.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🩹</text><text x="562" y="280.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Support with a firm</text><text x="562" y="296.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >bandage, not too tight</text><rect x="680" y="56" width="205" height="270" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><circle cx="782" cy="100" r="32" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="782" y="112.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >E</text><text x="782" y="168.0" font-size="21" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Elevation</text><text x="782" y="224.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🦵</text><text x="782" y="280.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Raise the injury</text><text x="782" y="296.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >above heart level</text><rect x="20" y="345" width="860" height="112" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><text x="40" y="373.0" font-size="15.5" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Some guides add &#x27;P&#x27; for Protect (PRICE). Newer advice is &#x27;PEACE and LOVE&#x27;:</text><text x="40" y="400.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >PEACE (first days): Protect, Elevate, Avoid anti-inflammatories, Compress, Educate.</text><text x="40" y="424.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >LOVE (after): Load gently, Optimism, Vascularisation (get the blood flowing), Exercise.</text><text x="40" y="448.0" font-size="15" text-anchor="start" font-weight="700" fill="#dc2626"  >Seek medical help for severe pain, deformity, numbness, or if you cannot put weight on it.</text>
</svg>
