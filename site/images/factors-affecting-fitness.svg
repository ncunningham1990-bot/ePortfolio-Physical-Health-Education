<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Physical, psychological and social factors affecting fitness</title><desc id="d">Three overlapping circles with examples of each factor.</desc>
<rect width="900" height="470" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Factors that affect fitness</text><circle cx="350" cy="200" r="125" fill="#15803d" stroke="#15803d" stroke-width="2" fill-opacity="0.22"/><circle cx="550" cy="200" r="125" fill="#dc2626" stroke="#dc2626" stroke-width="2" fill-opacity="0.22"/><circle cx="450" cy="320" r="125" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" fill-opacity="0.22"/><text x="285" y="150.0" font-size="17" text-anchor="middle" font-weight="800" fill="#15803d"  >PHYSICAL</text><text x="285" y="176.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >age, sex, genetics,</text><text x="285" y="192.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >sleep, diet, health,</text><text x="285" y="209.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >injury, body type</text><text x="615" y="150.0" font-size="16" text-anchor="middle" font-weight="800" fill="#dc2626"  >PSYCHOLOGICAL</text><text x="615" y="176.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >motivation, stress,</text><text x="615" y="192.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >confidence, mood,</text><text x="615" y="209.6" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >attitude to exercise</text><text x="450" y="362.0" font-size="17" text-anchor="middle" font-weight="800" fill="#b45309"  >SOCIAL</text><text x="450" y="386.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >family, friends, culture,</text><text x="450" y="402.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >access to facilities, cost, time</text><text x="450" y="232.0" font-size="18" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Your</text><text x="450" y="253.6" font-size="18" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >fitness</text>
</svg>
