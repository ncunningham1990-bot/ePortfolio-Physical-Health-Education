<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Inverted-U graph of arousal and performance</title><desc id="d">A curve rising to a peak at moderate arousal then falling, with under-aroused, optimal and over-aroused zones.</desc>
<rect width="900" height="440" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >The inverted-U hypothesis</text><line x1="100" y1="380" x2="800" y2="380" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><line x1="100" y1="380" x2="100" y2="90" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><text x="450.0" y="424.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Arousal (low to high)</text><text transform="translate(44 235.0) rotate(-90)" font-size="17" text-anchor="middle" font-weight="700">Performance</text><rect x="345" y="90" width="210" height="290" rx="0" fill="#22c55e" stroke="#22c55e" stroke-width="0" fill-opacity="0.18"/><path d="M100,350 C270,320 350,100 450.0,96 C550,100 630,320 800,350" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="220" y="190.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#6b7a70"  >UNDER-aroused</text><text x="220" y="207.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#6b7a70"  >bored, lacks focus,</text><text x="220" y="224.8" font-size="14.5" text-anchor="middle" font-weight="700" fill="#6b7a70"  >slow reactions</text><text x="450.0" y="80.0" font-size="15" text-anchor="middle" font-weight="800" fill="#15803d"  >OPTIMAL AROUSAL</text><text x="450.0" y="260.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#15803d"  >best performance:</text><text x="450.0" y="277.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#15803d"  >alert and in control</text><text x="680" y="190.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#dc2626"  >OVER-aroused</text><text x="680" y="207.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#dc2626"  >anxious, tense,</text><text x="680" y="224.8" font-size="14.5" text-anchor="middle" font-weight="700" fill="#dc2626"  >poor decisions</text>
</svg>
