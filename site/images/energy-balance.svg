<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Energy balance seesaws</title><desc id="d">Three seesaws showing balanced energy, energy intake above expenditure, and expenditure above intake.</desc>
<rect width="900" height="390" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy balance: energy in vs energy out</text><polygon points="136,240 184,240 160,170" fill="#9ca3af" stroke="#0b0f0c" stroke-width="2" stroke-linejoin="round" /><line x1="82.0" y1="170.0" x2="238.0" y2="170.0" stroke="#0b0f0c" stroke-width="8" stroke-linecap="round" /><rect x="26.0" y="108.0" width="112" height="52" rx="8" fill="#fde68a" stroke="#0b0f0c" stroke-width="2" /><text x="82.0" y="130.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy IN</text><text x="82.0" y="146.0" font-size="12" text-anchor="middle" font-weight="500" fill="#0b0f0c"  >(food, drink)</text><rect x="182.0" y="108.0" width="112" height="52" rx="8" fill="#bfdbfe" stroke="#0b0f0c" stroke-width="2" /><text x="238.0" y="130.0" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy OUT</text><text x="238.0" y="146.0" font-size="11.5" text-anchor="middle" font-weight="500" fill="#0b0f0c"  >(BMR + activity)</text><text x="160" y="278.0" font-size="17" text-anchor="middle" font-weight="800" fill="#15803d"  >Balanced</text><text x="160" y="300.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7a70"  >weight stays stable</text><polygon points="426,240 474,240 450,170" fill="#9ca3af" stroke="#0b0f0c" stroke-width="2" stroke-linejoin="round" /><line x1="374.31693335047225" y1="188.8699078567741" x2="525.6830666495277" y2="151.1300921432259" stroke="#0b0f0c" stroke-width="8" stroke-linecap="round" /><rect x="318.31693335047225" y="126.86990785677409" width="112" height="52" rx="8" fill="#fde68a" stroke="#0b0f0c" stroke-width="2" /><text x="374.31693335047225" y="148.9" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy IN</text><text x="374.31693335047225" y="164.9" font-size="12" text-anchor="middle" font-weight="500" fill="#0b0f0c"  >(food, drink)</text><rect x="469.68306664952775" y="89.13009214322591" width="112" height="52" rx="8" fill="#bfdbfe" stroke="#0b0f0c" stroke-width="2" /><text x="525.6830666495277" y="111.1" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy OUT</text><text x="525.6830666495277" y="127.1" font-size="11.5" text-anchor="middle" font-weight="500" fill="#0b0f0c"  >(BMR + activity)</text><text x="450" y="278.0" font-size="17" text-anchor="middle" font-weight="800" fill="#dc2626"  >Energy in &gt; energy out</text><text x="450" y="300.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7a70"  >extra energy is stored</text><polygon points="716,240 764,240 740,170" fill="#9ca3af" stroke="#0b0f0c" stroke-width="2" stroke-linejoin="round" /><line x1="664.3169333504723" y1="151.1300921432259" x2="815.6830666495277" y2="188.8699078567741" stroke="#0b0f0c" stroke-width="8" stroke-linecap="round" /><rect x="608.3169333504723" y="89.13009214322591" width="112" height="52" rx="8" fill="#fde68a" stroke="#0b0f0c" stroke-width="2" /><text x="664.3169333504723" y="111.1" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy IN</text><text x="664.3169333504723" y="127.1" font-size="12" text-anchor="middle" font-weight="500" fill="#0b0f0c"  >(food, drink)</text><rect x="759.6830666495277" y="126.86990785677409" width="112" height="52" rx="8" fill="#bfdbfe" stroke="#0b0f0c" stroke-width="2" /><text x="815.6830666495277" y="148.9" font-size="13" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Energy OUT</text><text x="815.6830666495277" y="164.9" font-size="11.5" text-anchor="middle" font-weight="500" fill="#0b0f0c"  >(BMR + activity)</text><text x="740" y="278.0" font-size="17" text-anchor="middle" font-weight="800" fill="#b45309"  >Energy out &gt; energy in</text><text x="740" y="300.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7a70"  >stored energy is used</text><text x="450" y="360.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Energy is measured in kilocalories (kcal) or kilojoules (kJ). Growing teenagers need plenty of energy.</text>
</svg>
