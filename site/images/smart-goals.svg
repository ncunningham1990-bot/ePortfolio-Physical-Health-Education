<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">SMART goals</title><desc id="d">Five rows explaining Specific, Measurable, Achievable, Relevant and Time-bound.</desc>
<rect width="900" height="430" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >SMART goals</text><rect x="40" y="60" width="820" height="60" rx="10" fill="#fafafa" stroke="#15803d" stroke-width="2" /><rect x="40" y="60" width="70" height="60" rx="10" fill="#15803d" stroke="none" stroke-width="0" /><text x="75" y="103.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >S</text><text x="130" y="98.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Specific</text><text x="330" y="98.0" font-size="17" text-anchor="start" font-weight="500" fill="#0b0f0c"  >What exactly will I do?</text><rect x="40" y="132" width="820" height="60" rx="10" fill="#fafafa" stroke="#15803d" stroke-width="2" /><rect x="40" y="132" width="70" height="60" rx="10" fill="#dc2626" stroke="none" stroke-width="0" /><text x="75" y="175.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >M</text><text x="130" y="170.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Measurable</text><text x="330" y="170.0" font-size="17" text-anchor="start" font-weight="500" fill="#0b0f0c"  >How will I track progress?</text><rect x="40" y="204" width="820" height="60" rx="10" fill="#fafafa" stroke="#15803d" stroke-width="2" /><rect x="40" y="204" width="70" height="60" rx="10" fill="#15803d" stroke="none" stroke-width="0" /><text x="75" y="247.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >A</text><text x="130" y="242.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Achievable</text><text x="330" y="242.0" font-size="17" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Is it challenging but realistic?</text><rect x="40" y="276" width="820" height="60" rx="10" fill="#fafafa" stroke="#15803d" stroke-width="2" /><rect x="40" y="276" width="70" height="60" rx="10" fill="#dc2626" stroke="none" stroke-width="0" /><text x="75" y="319.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >R</text><text x="130" y="314.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Relevant</text><text x="330" y="314.0" font-size="17" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Does it matter to me and my sport?</text><rect x="40" y="348" width="820" height="60" rx="10" fill="#fafafa" stroke="#15803d" stroke-width="2" /><rect x="40" y="348" width="70" height="60" rx="10" fill="#15803d" stroke="none" stroke-width="0" /><text x="75" y="391.0" font-size="36" text-anchor="middle" font-weight="800" fill="#fff"  >T</text><text x="130" y="386.0" font-size="22" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Time-bound</text><text x="330" y="386.0" font-size="17" text-anchor="start" font-weight="500" fill="#0b0f0c"  >What is my deadline?</text>
</svg>
