<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Physiological and psychological responses to arousal</title><desc id="d">A body outline with physiological responses on the left and psychological responses on the right.</desc>
<rect width="900" height="500" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Responses to arousal</text><circle cx="450" cy="110" r="36" fill="#e5e7eb" stroke="#0b0f0c" stroke-width="3" /><path d="M390,158 Q450,140 510,158 L500,320 L400,320 Z" fill="#e5e7eb" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="394" y1="165" x2="360" y2="300" stroke="#0b0f0c" stroke-width="12" stroke-linecap="round" /><line x1="506" y1="165" x2="540" y2="300" stroke="#0b0f0c" stroke-width="12" stroke-linecap="round" /><line x1="426" y1="320" x2="420" y2="470" stroke="#0b0f0c" stroke-width="14" stroke-linecap="round" /><line x1="474" y1="320" x2="480" y2="470" stroke="#0b0f0c" stroke-width="14" stroke-linecap="round" /><text x="459" y="214.0" font-size="22" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >❤️</text><text x="130" y="66.0" font-size="17" text-anchor="middle" font-weight="800" fill="#15803d"  >PHYSIOLOGICAL (body)</text><line x1="446" y1="112" x2="250" y2="125" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" /><circle cx="446" cy="112" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1" /><text x="244" y="130.0" font-size="15" text-anchor="end" font-weight="600" fill="#0b0f0c"  >Sweating</text><line x1="430" y1="190" x2="250" y2="185" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" /><circle cx="430" cy="190" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1" /><text x="244" y="190.0" font-size="15" text-anchor="end" font-weight="600" fill="#0b0f0c"  >Breathing gets faster</text><line x1="459" y1="208" x2="250" y2="245" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" /><circle cx="459" cy="208" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1" /><text x="244" y="250.0" font-size="15" text-anchor="end" font-weight="600" fill="#0b0f0c"  >Heart rate increases</text><line x1="368" y1="260" x2="250" y2="305" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" /><circle cx="368" cy="260" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1" /><text x="244" y="310.0" font-size="15" text-anchor="end" font-weight="600" fill="#0b0f0c"  >Muscle tension</text><line x1="450" y1="280" x2="250" y2="365" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" /><circle cx="450" cy="280" r="3.5" fill="#dc2626" stroke="#dc2626" stroke-width="1" /><text x="244" y="370.0" font-size="15" text-anchor="end" font-weight="600" fill="#0b0f0c"  >‘Butterflies’ / dry mouth</text><text x="770" y="66.0" font-size="17" text-anchor="middle" font-weight="800" fill="#dc2626"  >PSYCHOLOGICAL (mind)</text><rect x="620" y="108" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" /><text x="750" y="134.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Worry and negative thoughts</text><rect x="620" y="168" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" /><text x="750" y="194.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Difficulty concentrating</text><rect x="620" y="228" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" /><text x="750" y="254.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Irritability, mood swings</text><rect x="620" y="288" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" /><text x="750" y="314.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Changes in confidence</text><rect x="620" y="348" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" /><text x="750" y="374.0" font-size="14" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Feeling ‘psyched up’ (positive)</text>
