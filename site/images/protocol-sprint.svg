<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Sprint test</title><desc id="d">Runner accelerating over a measured 30 or 40 metre straight.</desc>
<rect width="900" height="470" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >30 m / 40 m sprint test</text><line x1="60" y1="200" x2="840" y2="200" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><line x1="100" y1="170" x2="100" y2="230" stroke="#15803d" stroke-width="6" stroke-linecap="round" /><text x="100" y="262.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Start</text><line x1="820" y1="170" x2="820" y2="230" stroke="#dc2626" stroke-width="6" stroke-linecap="round" /><text x="820" y="262.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Finish</text><circle cx="410" cy="110" r="14" fill="#fff" stroke="#0b0f0c" stroke-width="5" /><line x1="400" y1="132" x2="375" y2="185" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" /><path d="M400,132 L430,150 L455,135" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M400,132 L375,150 L350,165" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M375,185 L415,205 L400,245" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M375,185 L345,210 L320,245" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><line x1="480" y1="125" x2="650" y2="125" stroke="#15803d" stroke-width="4" stroke-linecap="round" /><polygon points="650,125 639.2,130.2 639.2,119.8" fill="#15803d"/><line x1="100" y1="290" x2="820" y2="290" stroke="#6b7a70" stroke-width="2" stroke-linecap="round" /><line x1="100" y1="283" x2="100" y2="297" stroke="#6b7a70" stroke-width="2" stroke-linecap="round" /><line x1="820" y1="283" x2="820" y2="297" stroke="#6b7a70" stroke-width="2" stroke-linecap="round" /><text x="460" y="320.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Marked distance (30 m or 40 m)</text><rect x="60" y="350" width="780" height="100" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="80" y="378.0" font-size="15.5" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Start from a standing or crouch start behind the line. Timer starts on the first movement</text><text x="80" y="400.0" font-size="15.5" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >and stops as the torso crosses the finish line. Run through the line. Record time to 0.1 s.</text><text x="80" y="424.0" font-size="15.5" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Measures: speed. Use the same surface and footwear when you retest.</text>
</svg>
