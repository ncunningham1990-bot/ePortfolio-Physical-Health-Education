<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Progressive overload and reversibility</title><desc id="d">Fitness rising in steps with training, then falling when training stops.</desc>
<rect width="900" height="400" fill="#fff"/>
<text x="450" y="34.0" font-size="22" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Progressive overload and reversibility</text><line x1="90" y1="330" x2="840" y2="330" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><line x1="90" y1="70" x2="90" y2="330" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><path d="M90,300 L160,300 L200,270 L260,270 L300,235 L360,235 L400,200 L460,200 L500,165 L540,165" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M540,165 L600,200 L660,250 L720,285 L780,300" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="300" y="120.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d"  >Progressive overload:</text><text x="300" y="138.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d"  >gradually increase the demand</text><text x="300" y="156.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d"  >and fitness steps up</text><text x="690" y="150.0" font-size="15" text-anchor="middle" font-weight="700" fill="#dc2626"  >Reversibility:</text><text x="690" y="168.0" font-size="15" text-anchor="middle" font-weight="700" fill="#dc2626"  >stop training and</text><text x="690" y="186.0" font-size="15" text-anchor="middle" font-weight="700" fill="#dc2626"  >fitness is lost</text><text x="465" y="372.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Time</text><text transform="translate(40 200.0) rotate(-90)" font-size="16" text-anchor="middle" font-weight="700">Fitness level</text><text x="540" y="155.0" font-size="13" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Training stops</text>
</svg>
