<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Antagonistic pair: biceps and triceps</title><desc id="d">Two arm diagrams: bending with the biceps contracted and straightening with the triceps contracted.</desc>
<rect width="900" height="730" fill="#fff"/>
