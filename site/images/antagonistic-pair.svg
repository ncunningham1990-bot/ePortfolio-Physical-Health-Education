necap="round" /><circle cx="550" cy="490" r="14" fill="#fecaca" stroke="#b91c1c" stroke-width="3" /><path d="M520.0,308.0 Q486.0,396.3 516.0,486.0 Q550.0,397.7 520.0,308.0 Z" fill="#c4524b" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="575.6166302371606" y1="501.9342639653682" x2="563.435480089918" y2="543.7151385591502" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><line x1="574" y1="298" x2="580" y2="308" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><path d="M580.0,308.0 Q565.8,404.7 575.6,501.9 Q589.8,405.2 580.0,308.0 Z" fill="#f0c4c1" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="215" y="66.0" font-size="19" text-anchor="middle" font-weight="800" fill="#15803d"  >Flexion (bending)</text><text x="215" y="92.0" font-size="15" text-anchor="middle" font-weight="700" fill="#6e211d"  >Biceps = agonist (contracts)</text><text x="215" y="112.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Triceps = antagonist (relaxes)</text><text x="675" y="66.0" font-size="19" text-anchor="middle" font-weight="800" fill="#15803d"  >Extension (straightening)</text><text x="675" y="92.0" font-size="15" text-anchor="middle" font-weight="700" fill="#6e211d"  >Triceps = agonist (contracts)</text><text x="675" y="112.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Biceps = antagonist (relaxes)</text><line x1="450" y1="150" x2="450" y2="700" stroke="#d6d9de" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
