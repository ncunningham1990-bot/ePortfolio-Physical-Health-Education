<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Fixed, slightly moveable and freely moveable joints</title><desc id="d">Three panels illustrating the three joint types with examples.</desc>
<rect width="900" height="380" fill="#fff"/>
<text x="450" y="32.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Three types of joint</text><rect x="20" y="52" width="275" height="300" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="157" y="84.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Fixed</text><text x="157" y="106.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >no movement</text><rect x="45" y="160" width="110" height="90" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5" /><rect x="160" y="160" width="110" height="90" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5" /><path d="M155,160 L162,178 L152,196 L162,214 L152,232 L158,250" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="157" y="290.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Skull (cranium plates)</text><text x="157" y="312.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7a70"  >joined by fibrous tissue</text><rect x="312" y="52" width="275" height="300" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="449" y="84.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Slightly moveable</text><text x="449" y="106.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >small movement</text><rect x="374" y="140" width="150" height="50" rx="12" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5" /><rect x="374" y="214" width="150" height="50" rx="12" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5" /><rect x="384" y="192" width="130" height="20" rx="8" fill="#93c5fd" stroke="#2563eb" stroke-width="2" /><text x="449" y="182.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >vertebra</text><text x="449" y="257.0" font-size="13" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >vertebra</text><text x="449" y="207.0" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1e3a8a"  >cartilage disc</text><text x="449" y="290.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Vertebrae of the spine</text><text x="449" y="312.0" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7a70"  >cartilage pad between bones</text><rect x="604" y="52" width="275" height="300" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="741" y="84.0" font-size="21" text-anchor="middle" font-weight="800" fill="#15803d"  >Freely moveable</text><text x="741" y="106.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >synovial joint</text><path d="M694,135 L794,135 L794,190 C794,225 694,225 694,190 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M694,262 L794,262 L794,320 L694,320 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="692" y="215" width="104" height="45" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.8"/><text x="741" y="242.0" font-size="12" text-anchor="middle" font-weight="600" fill="#854d0e"  >fluid-filled</text><text x="741" y="340.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Knee, hip, shoulder, elbow</text>
</svg>
