<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Intrinsic and extrinsic motivation</title><desc id="d">Two panels contrasting motivation from within with motivation from rewards.</desc>
<rect width="900" height="450" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Types of motivation</text><rect x="30" y="60" width="400" height="330" rx="14" fill="#ecfdf5" stroke="#15803d" stroke-width="2.5" /><text x="230" y="96.0" font-size="22" text-anchor="middle" font-weight="800" fill="#15803d"  >Intrinsic (from within)</text><circle cx="230" cy="190" r="52" fill="#fff" stroke="#15803d" stroke-width="4" /><text x="230" y="205.0" font-size="52" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >😊</text><text x="230" y="285.0" font-size="15" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >enjoyment, challenge, personal</text><text x="230" y="303.0" font-size="15" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >satisfaction, mastering a skill</text><text x="230" y="350.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#15803d"  >“I play because I love it.”</text><rect x="470" y="60" width="400" height="330" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" /><text x="670" y="96.0" font-size="22" text-anchor="middle" font-weight="800" fill="#dc2626"  >Extrinsic (from outside)</text><text x="670" y="205.0" font-size="40" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🏆  🥇  💰  👏</text><text x="670" y="285.0" font-size="15" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >trophies, medals, prizes, praise,</text><text x="670" y="303.0" font-size="15" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >avoiding punishment</text><text x="670" y="350.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#dc2626"  >“I play to win the medal.”</text><text x="450" y="425.0" font-size="15" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Intrinsic motivation tends to last longer; both types can work together.</text>
</svg>
