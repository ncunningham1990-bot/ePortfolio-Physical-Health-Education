<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Box breathing</title><desc id="d">A square with four sides: breathe in, hold, breathe out, hold, each for a count of four.</desc>
<rect width="900" height="490" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Box breathing (4-4-4-4)</text><rect x="300" y="90" width="300" height="300" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="5" /><text x="450" y="76.0" font-size="16" text-anchor="middle" font-weight="800" fill="#15803d"  >1. Breathe IN through the nose (count 4)</text><text x="616" y="240.0" font-size="16" text-anchor="start" font-weight="800" fill="#b45309"  >2. HOLD</text><text x="616" y="259.2" font-size="16" text-anchor="start" font-weight="800" fill="#b45309"  >(count 4)</text><text x="450" y="420.0" font-size="16" text-anchor="middle" font-weight="800" fill="#dc2626"  >3. Breathe OUT slowly through the mouth (count 4)</text><text x="284" y="240.0" font-size="16" text-anchor="end" font-weight="800" fill="#2563eb"  >4. HOLD</text><text x="284" y="259.2" font-size="16" text-anchor="end" font-weight="800" fill="#2563eb"  >(count 4)</text><line x1="340" y1="130" x2="550" y2="130" stroke="#15803d" stroke-width="5" stroke-linecap="round" /><polygon points="550,130 537.4,136.1 537.4,123.9" fill="#15803d"/><line x1="560" y1="140" x2="560" y2="340" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" /><polygon points="560,340 553.9,327.4 566.1,327.4" fill="#f59e0b"/><line x1="550" y1="350" x2="350" y2="350" stroke="#dc2626" stroke-width="5" stroke-linecap="round" /><polygon points="350,350 362.6,343.9 362.6,356.1" fill="#dc2626"/><line x1="340" y1="340" x2="340" y2="140" stroke="#2563eb" stroke-width="5" stroke-linecap="round" /><polygon points="340,140 346.1,152.6 333.9,152.6" fill="#2563eb"/><text x="450" y="246.0" font-size="18" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Repeat 4-6 rounds</text><text x="450" y="470.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Slow, controlled breathing lowers heart rate and helps you feel calm before performing.</text>
</svg>
