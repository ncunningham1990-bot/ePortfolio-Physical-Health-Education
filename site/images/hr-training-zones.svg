<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Heart rate training zones</title><desc id="d">Five bars from zone 1 (50-60% of max HR) to zone 5 (90-100%) with example beats per minute.</desc>
<rect width="900" height="420" fill="#fff"/>
<text x="450" y="34.0" font-size="21" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Heart rate training zones (example: age 15, max HR 205 bpm)</text><text x="450" y="58.0" font-size="14" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Estimated max HR = 220 − age. Zones are a % of max HR.</text><rect x="40" y="80" width="220" height="54" rx="6" fill="#22c55e" stroke="#0b0f0c" stroke-width="1.5" /><text x="54" y="104.0" font-size="17" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Zone 1  50-60%</text><text x="54" y="124.0" font-size="13.5" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Very light: warm-up, recovery</text><text x="274" y="113.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >102-123 bpm</text><rect x="40" y="146" width="320" height="54" rx="6" fill="#86efac" stroke="#0b0f0c" stroke-width="1.5" /><text x="54" y="170.0" font-size="17" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Zone 2  60-70%</text><text x="54" y="190.0" font-size="13.5" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Light: aerobic base</text><text x="374" y="179.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >123-144 bpm</text><rect x="40" y="212" width="420" height="54" rx="6" fill="#fde047" stroke="#0b0f0c" stroke-width="1.5" /><text x="54" y="236.0" font-size="17" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Zone 3  70-80%</text><text x="54" y="256.0" font-size="13.5" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Moderate: aerobic fitness</text><text x="474" y="245.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >144-164 bpm</text><rect x="40" y="278" width="520" height="54" rx="6" fill="#fb923c" stroke="#0b0f0c" stroke-width="1.5" /><text x="54" y="302.0" font-size="17" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Zone 4  80-90%</text><text x="54" y="322.0" font-size="13.5" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Hard: anaerobic threshold</text><text x="574" y="311.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >164-184 bpm</text><rect x="40" y="344" width="620" height="54" rx="6" fill="#dc2626" stroke="#0b0f0c" stroke-width="1.5" /><text x="54" y="368.0" font-size="17" text-anchor="start" font-weight="800" fill="#0b0f0c"  >Zone 5  90-100%</text><text x="54" y="388.0" font-size="13.5" text-anchor="start" font-weight="500" fill="#0b0f0c"  >Maximum effort</text><text x="674" y="377.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >184-205 bpm</text>
</svg>
