<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Karvonen method worked example</title><desc id="d">Step-by-step calculation of a target heart rate using heart rate reserve.</desc>
<rect width="900" height="440" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Karvonen method: worked example</text><rect x="40" y="60" width="820" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" /><text x="450" y="98.0" font-size="20" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Target HR = [(Max HR − Resting HR) × intensity %] + Resting HR</text><circle cx="70" cy="167" r="20" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="70" y="174.0" font-size="20" text-anchor="middle" font-weight="800" fill="#fff"  >1</text><rect x="105" y="145" width="755" height="46" rx="8" fill="#f2f5f2" stroke="#15803d" stroke-width="1.5" /><text x="125" y="174.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Max HR</text><text x="840" y="174.0" font-size="17" text-anchor="end" font-weight="800" fill="#15803d"  >220 − 15 = 205 bpm</text><circle cx="70" cy="229" r="20" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="70" y="236.0" font-size="20" text-anchor="middle" font-weight="800" fill="#fff"  >2</text><rect x="105" y="207" width="755" height="46" rx="8" fill="#f2f5f2" stroke="#15803d" stroke-width="1.5" /><text x="125" y="236.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Heart rate reserve (HRR)</text><text x="840" y="236.0" font-size="17" text-anchor="end" font-weight="800" fill="#15803d"  >205 − 65 = 140 bpm</text><circle cx="70" cy="291" r="20" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="70" y="298.0" font-size="20" text-anchor="middle" font-weight="800" fill="#fff"  >3</text><rect x="105" y="269" width="755" height="46" rx="8" fill="#f2f5f2" stroke="#15803d" stroke-width="1.5" /><text x="125" y="298.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Intensity: 70% of HRR</text><text x="840" y="298.0" font-size="17" text-anchor="end" font-weight="800" fill="#15803d"  >140 × 0.70 = 98</text><circle cx="70" cy="353" r="20" fill="#15803d" stroke="#15803d" stroke-width="1" /><text x="70" y="360.0" font-size="20" text-anchor="middle" font-weight="800" fill="#fff"  >4</text><rect x="105" y="331" width="755" height="46" rx="8" fill="#f2f5f2" stroke="#15803d" stroke-width="1.5" /><text x="125" y="360.0" font-size="17" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Add resting HR back</text><text x="840" y="360.0" font-size="17" text-anchor="end" font-weight="800" fill="#15803d"  >98 + 65 = 163 bpm</text><text x="450" y="420.0" font-size="15" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Student aged 15 with a resting heart rate of 65 bpm training at 70% intensity</text>
</svg>
