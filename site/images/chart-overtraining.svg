<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Over-training and performance</title><desc id="d">Performance rises with balanced training then falls when training load is too high.</desc>
<rect width="900" height="380" fill="#fff"/>
<text x="450" y="34.0" font-size="22" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Training load and performance</text><line x1="90" y1="320" x2="840" y2="320" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><line x1="90" y1="70" x2="90" y2="320" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><path d="M90,290 C200,260 300,190 400,130 C480,85 520,100 570,150 C620,205 680,260 780,290" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="400" y="76" width="160" height="244" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="0" fill-opacity="0.08"/><line x1="400" y1="76" x2="400" y2="320" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="240" y="110.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d"  >Good training: load and</text><text x="240" y="128.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d"  >recovery are balanced,</text><text x="240" y="146.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15803d"  >performance improves</text><text x="660" y="110.0" font-size="15" text-anchor="middle" font-weight="700" fill="#dc2626"  >Over-training: too much load,</text><text x="660" y="128.0" font-size="15" text-anchor="middle" font-weight="700" fill="#dc2626"  >too little recovery,</text><text x="660" y="146.0" font-size="15" text-anchor="middle" font-weight="700" fill="#dc2626"  >performance falls</text><text x="465" y="352.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Training load over time</text><text transform="translate(40 195.0) rotate(-90)" font-size="16" text-anchor="middle" font-weight="700">Performance</text>
</svg>
