<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" width="900" height="415" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Psychological skills training toolkit</title><desc id="d">Four tiles: mental imagery, breathing techniques, muscle relaxation and self-talk.</desc>
<rect width="900" height="415" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Psychological skills training (PST) toolkit</text><rect x="20" y="56" width="205" height="300" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><text x="122" y="128.0" font-size="52" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🧠</text><text x="122" y="180.0" font-size="18" text-anchor="middle" font-weight="800" fill="#15803d"  >Mental imagery</text><text x="122" y="222.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Picture yourself performing</text><text x="122" y="238.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >the skill successfully using</text><text x="122" y="254.4" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >all your senses</text><rect x="240" y="56" width="205" height="300" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><text x="342" y="128.0" font-size="52" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🌬️</text><text x="342" y="180.0" font-size="18" text-anchor="middle" font-weight="800" fill="#15803d"  >Breathing techniques</text><text x="342" y="222.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Slow, controlled breaths</text><text x="342" y="238.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >to reduce heart rate and</text><text x="342" y="254.4" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >calm nerves</text><rect x="460" y="56" width="205" height="300" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><text x="562" y="128.0" font-size="52" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >💆</text><text x="562" y="180.0" font-size="18" text-anchor="middle" font-weight="800" fill="#15803d"  >Muscle relaxation</text><text x="562" y="222.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Tense then release muscle</text><text x="562" y="238.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >groups to reduce tension</text><text x="562" y="254.4" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >and somatic anxiety</text><rect x="680" y="56" width="205" height="300" rx="14" fill="#fafafa" stroke="#15803d" stroke-width="2.5" /><text x="782" y="128.0" font-size="52" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >🗣️</text><text x="782" y="180.0" font-size="18" text-anchor="middle" font-weight="800" fill="#15803d"  >Self-talk</text><text x="782" y="222.0" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Positive, instructional</text><text x="782" y="238.2" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >and motivational words</text><text x="782" y="254.4" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >to build focus and confidence</text><text x="450" y="392.0" font-size="15" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Practise these regularly, not just before competition.</text>
</svg>
