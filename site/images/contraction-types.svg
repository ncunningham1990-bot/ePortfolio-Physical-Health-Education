<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Isometric, concentric and eccentric muscle contractions</title><desc id="d">Three arm diagrams showing a muscle held at constant length, shortening, and lengthening.</desc>
<rect width="900" height="660" fill="#fff"/>
<text x="450" y="32.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Types of muscle contraction</text><rect x="15" y="52" width="280" height="590" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="155" y="84.0" font-size="20" text-anchor="middle" font-weight="800" fill="#15803d"  >Isometric</text><text x="155" y="106.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >muscle stays the same length</text><polygon points="0,170 100,160 75,270 15,250" fill="#e5e7eb" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" /><line x1="70" y1="256" x2="70" y2="450" stroke="#b91c1c" stroke-width="20" stroke-linecap="round" /><line x1="70" y1="256" x2="70" y2="450" stroke="#fecaca" stroke-width="16" stroke-linecap="round" /><line x1="70" y1="450" x2="260.0" y2="450.0" stroke="#b91c1c" stroke-width="18" stroke-linecap="round" /><line x1="70" y1="450" x2="260.0" y2="450.0" stroke="#fecaca" stroke-width="14" stroke-linecap="round" /><circle cx="70" cy="450" r="14" fill="#fecaca" stroke="#b91c1c" stroke-width="3" /><path d="M40.0,268.0 Q24.0,356.7 36.0,446.0 Q52.0,357.3 40.0,268.0 Z" fill="#e8a39e" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="133.19977783581658" y1="410.2890711872099" x2="130.0" y2="452.0" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><line x1="94" y1="258" x2="100" y2="268" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><path d="M100.0,268.0 Q91.3,345.1 133.2,410.3 Q141.9,333.2 100.0,268.0 Z" fill="#c4524b" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="260.0" y1="420.0" x2="260.0" y2="480.0" stroke="#0b0f0c" stroke-width="4" stroke-linecap="round" /><rect x="246.0" y="410.0" width="28" height="14" rx="3" fill="#0b0f0c" stroke="#0b0f0c" stroke-width="1" /><rect x="246.0" y="476.0" width="28" height="14" rx="3" fill="#0b0f0c" stroke="#0b0f0c" stroke-width="1" /><text x="155" y="620.0" font-size="13" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >plank, wall sit, holding a handstand</text><rect x="310" y="52" width="280" height="590" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="450" y="84.0" font-size="20" text-anchor="middle" font-weight="800" fill="#15803d"  >Isotonic: concentric</text><text x="450" y="106.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >muscle shortens (lifting)</text><polygon points="295,170 395,160 370,270 310,250" fill="#e5e7eb" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" /><line x1="365" y1="256" x2="365" y2="450" stroke="#b91c1c" stroke-width="20" stroke-linecap="round" /><line x1="365" y1="256" x2="365" y2="450" stroke="#fecaca" stroke-width="16" stroke-linecap="round" /><line x1="365" y1="450" x2="454.1995969293193" y2="282.23995735680387" stroke="#b91c1c" stroke-width="18" stroke-linecap="round" /><line x1="365" y1="450" x2="454.1995969293193" y2="282.23995735680387" stroke="#fecaca" stroke-width="14" stroke-linecap="round" /><circle cx="365" cy="450" r="14" fill="#fecaca" stroke="#b91c1c" stroke-width="3" /><path d="M335.0,268.0 Q321.0,356.7 331.0,446.0 Q345.0,357.3 335.0,268.0 Z" fill="#e8a39e" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="407.05346752217594" y1="364.12039815244873" x2="397.4125212648663" y2="406.0867251713358" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><line x1="389" y1="258" x2="395" y2="268" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><path d="M395.0,268.0 Q369.3,320.0 407.1,364.1 Q432.8,312.1 395.0,268.0 Z" fill="#c4524b" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="482.1995969293193" y1="322.23995735680387" x2="482.1995969293193" y2="272.23995735680387" stroke="#dc2626" stroke-width="4" stroke-linecap="round" /><polygon points="482.1995969293193,272.23995735680387 487.4,283.0 477.0,283.0" fill="#dc2626"/><text x="450" y="620.0" font-size="13" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >upward phase of a bicep curl</text><rect x="605" y="52" width="280" height="590" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="745" y="84.0" font-size="20" text-anchor="middle" font-weight="800" fill="#15803d"  >Isotonic: eccentric</text><text x="745" y="106.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >muscle lengthens (lowering)</text><polygon points="590,170 690,160 665,270 605,250" fill="#e5e7eb" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" /><line x1="660" y1="256" x2="660" y2="450" stroke="#b91c1c" stroke-width="20" stroke-linecap="round" /><line x1="660" y1="256" x2="660" y2="450" stroke="#fecaca" stroke-width="16" stroke-linecap="round" /><line x1="660" y1="450" x2="824.5448267190434" y2="545.0" stroke="#b91c1c" stroke-width="18" stroke-linecap="round" /><line x1="660" y1="450" x2="824.5448267190434" y2="545.0" stroke="#fecaca" stroke-width="14" stroke-linecap="round" /><circle cx="660" cy="450" r="14" fill="#fecaca" stroke="#b91c1c" stroke-width="3" /><path d="M630.0,268.0 Q616.0,356.7 626.0,446.0 Q640.0,357.3 630.0,268.0 Z" fill="#e8a39e" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="718.1498192783326" y1="436.1040676529593" x2="713.0333209967908" y2="478.0" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><line x1="684" y1="258" x2="690" y2="268" stroke="#d6a77a" stroke-width="5" stroke-linecap="round" /><path d="M690.0,268.0 Q678.4,356.3 718.1,436.1 Q729.7,347.8 690.0,268.0 Z" fill="#c4524b" stroke="#6e211d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="848.5448267190434" y1="505.0" x2="848.5448267190434" y2="550.0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" /><polygon points="848.5448267190434,550.0 843.3,539.2 853.8,539.2" fill="#dc2626"/><text x="745" y="620.