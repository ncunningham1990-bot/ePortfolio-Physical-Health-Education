<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">PAR-Q flow chart</title><desc id="d">Flow chart: complete the PAR-Q, then either start gradually or speak to a doctor.</desc>
<rect width="900" height="515" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >How the PAR-Q is used</text><rect x="50" y="80" width="380" height="130" rx="12" fill="#e0f2fe" stroke="#0b0f0c" stroke-width="2" /><text x="240" y="114.0" font-size="19" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >1. Answer the PAR-Q</text><text x="240" y="144.0" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >A short set of yes / no health</text><text x="240" y="161.4" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >questions about heart, chest pain,</text><text x="240" y="178.8" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >dizziness, bones/joints, medication</text><rect x="50" y="250" width="380" height="130" rx="12" fill="#fef9c3" stroke="#0b0f0c" stroke-width="2" /><text x="240" y="284.0" font-size="19" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >2. Check your answers</text><text x="240" y="314.0" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Did you answer YES to</text><text x="240" y="331.4" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >any question?</text><line x1="240" y1="210" x2="240" y2="248" stroke="#0b0f0c" stroke-width="3.5" stroke-linecap="round" /><polygon points="240,248 235.2,238.1 244.8,238.1" fill="#0b0f0c"/><rect x="500" y="200" width="360" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" /><text x="680" y="232.0" font-size="19" text-anchor="middle" font-weight="800" fill="#15803d"  >All answers NO</text><text x="680" y="262.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >It is generally safe to start</text><text x="680" y="280.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >gradually and build up.</text><rect x="500" y="345" width="360" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" /><text x="680" y="377.0" font-size="19" text-anchor="middle" font-weight="800" fill="#dc2626"  >Any answer YES</text><text x="680" y="407.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >Talk to a doctor or your parent /</text><text x="680" y="425.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >guardian before increasing activity.</text><line x1="430" y1="300" x2="498" y2="262" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" /><polygon points="498,262 491.7,271.0 487.0,262.7" fill="#15803d"/><line x1="430" y1="330" x2="498" y2="395" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" /><polygon points="498,395 487.5,391.6 494.1,384.7" fill="#dc2626"/><text x="450" y="495.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#6b7a70"  >The PAR-Q is a screening tool, not a medical diagnosis. It is one part of safe practice.</text>
</svg>
