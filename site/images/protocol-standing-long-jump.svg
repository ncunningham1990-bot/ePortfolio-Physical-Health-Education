<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Standing long jump</title><desc id="d">Take-off line, jumping arc and landing, with the distance measured to the rear heel.</desc>
<rect width="900" height="470" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Standing long jump</text><line x1="40" y1="250" x2="860" y2="250" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><line x1="150" y1="235" x2="150" y2="265" stroke="#dc2626" stroke-width="5" stroke-linecap="round" /><text x="150" y="290.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Take-off line</text><circle cx="120" cy="120" r="14" fill="#fff" stroke="#0b0f0c" stroke-width="5" /><line x1="125" y1="140" x2="140" y2="205" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" /><path d="M125,140 L110,190" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M125,140 L155,185" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M140,205 L130,250" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M140,205 L150,250" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="400" cy="90" r="14" fill="#fff" stroke="#8aa191" stroke-width="5" /><line x1="390" y1="110" x2="350" y2="160" stroke="#8aa191" stroke-width="7" stroke-linecap="round" /><path d="M390,110 L430,100 L460,80" fill="none" stroke="#8aa191" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M390,110 L420,120 L450,100" fill="none" stroke="#8aa191" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M350,160 L380,200 L410,235" fill="none" stroke="#8aa191" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M350,160 L360,205 L390,245" fill="none" stroke="#8aa191" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><circle cx="640" cy="165" r="14" fill="#fff" stroke="#0b0f0c" stroke-width="5" /><line x1="645" y1="190" x2="630" y2="235" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" /><path d="M645,190 L670,215 L690,225" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M645,190 L660,205 L685,210" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M630,235 L640,250" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M630,235 L620,250" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,235 Q400,20 625,235" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><line x1="150" y1="305" x2="625" y2="305" stroke="#6b7a70" stroke-width="2" stroke-linecap="round" /><line x1="150" y1="298" x2="150" y2="312" stroke="#6b7a70" stroke-width="2" stroke-linecap="round" /><line x1="625" y1="298" x2="625" y2="312" stroke="#6b7a70" stroke-width="2" stroke-linecap="round" /><text x="388" y="335.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Measure from the take-off line to the back of the nearest heel</text><rect x="60" y="360" width="780" height="90" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="80" y="388.0" font-size="15.5" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Feet shoulder-width apart behind the line. Swing the arms back, then jump forward as far as you can,</text><text x="80" y="410.0" font-size="15.5" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >landing on both feet without falling backwards. Record the best of 3 attempts in cm or m.</text><text x="80" y="432.0" font-size="15.5" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Measures: leg power.</text>
</svg>
