<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Four types of bone</title><desc id="d">Long, short, flat and irregular bones with examples.</desc>
<rect width="900" height="410" fill="#fff"/>
<text x="450" y="32.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Four types of bone</text><rect x="20" y="52" width="200" height="330" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="120" y="86.0" font-size="22" text-anchor="middle" font-weight="800" fill="#15803d"  >Long</text><text x="120" y="108.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >longer than wide</text><rect x="109" y="140" width="22" height="130" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><circle cx="106" cy="140" r="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><circle cx="134" cy="140" r="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><circle cx="106" cy="270" r="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><circle cx="134" cy="270" r="15" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><rect x="111" y="140" width="18" height="130" rx="0" fill="#fecaca" stroke="none" stroke-width="0" /><text x="120" y="305.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >femur, humerus,</text><text x="120" y="322.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >radius, tibia</text><text x="120" y="352.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >levers for movement</text><rect x="235" y="52" width="200" height="330" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="335" y="86.0" font-size="22" text-anchor="middle" font-weight="800" fill="#15803d"  >Short</text><text x="335" y="108.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >roughly cube-shaped</text><rect x="287" y="160" width="28" height="30" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><rect x="321" y="160" width="28" height="30" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><rect x="355" y="160" width="28" height="30" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><rect x="287" y="200" width="28" height="30" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><rect x="321" y="200" width="28" height="30" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><rect x="355" y="200" width="28" height="30" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5" /><text x="335" y="305.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >carpals (wrist),</text><text x="335" y="322.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >tarsals (ankle)</text><text x="335" y="352.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >stability + small movements</text><rect x="450" y="52" width="200" height="330" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="550" y="86.0" font-size="22" text-anchor="middle" font-weight="800" fill="#15803d"  >Flat</text><text x="550" y="108.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >thin and curved</text><path d="M480,215 Q550,120 620,215 Q550,250 480,215 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M500,210 Q550,150 600,210" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="550" y="305.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >cranium, sternum,</text><text x="550" y="322.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >ribs, scapula</text><text x="550" y="352.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >protect organs, muscle attachment</text><rect x="665" y="52" width="200" height="330" rx="10" fill="#fafafa" stroke="#d6d9de" stroke-width="1.5" /><text x="765" y="86.0" font-size="22" text-anchor="middle" font-weight="800" fill="#15803d"  >Irregular</text><text x="765" y="108.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >complex shapes</text><path d="M725,220 Q713,180 741,170 L751,140 L779,140 L789,170 Q817,180 805,220 Q795,262 765,256 Q735,262 725,220 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="765" cy="208" rx="13" ry="15" fill="#fff" stroke="#b91c1c" stroke-width="2" /><text x="765" y="305.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >vertebrae,</text><text x="765" y="322.4" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >pelvis</text><text x="765" y="352.0" font-size="12.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >protection + support</text>
</svg>
