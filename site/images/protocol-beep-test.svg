<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Multistage fitness test layout</title><desc id="d">Two lines 20 metres apart with cones; runners shuttle between them to a beep.</desc>
<rect width="900" height="460" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Multistage fitness (bleep) test: set-up</text><line x1="110" y1="160" x2="110" y2="260" stroke="#0b0f0c" stroke-width="4" stroke-linecap="round" /><line x1="790" y1="160" x2="790" y2="260" stroke="#0b0f0c" stroke-width="4" stroke-linecap="round" /><text x="110" y="134.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Line A</text><text x="790" y="134.0" font-size="16" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Line B</text><line x1="130" y1="190" x2="770" y2="190" stroke="#15803d" stroke-width="4" stroke-linecap="round" /><polygon points="770,190 759.2,195.2 759.2,184.8" fill="#15803d"/><line x1="770" y1="230" x2="130" y2="230" stroke="#dc2626" stroke-width="4" stroke-linecap="round" /><polygon points="130,230 140.8,224.8 140.8,235.2" fill="#dc2626"/><line x1="110" y1="285" x2="790" y2="285" stroke="#6b7a70" stroke-width="1.5" stroke-linecap="round" /><line x1="110" y1="278" x2="110" y2="292" stroke="#6b7a70" stroke-width="1.5" stroke-linecap="round" /><line x1="790" y1="278" x2="790" y2="292" stroke="#6b7a70" stroke-width="1.5" stroke-linecap="round" /><text x="450" y="308.0" font-size="20" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >20 m</text><polygon points="110,149 101,171 119,171" fill="#dc2626" stroke="#0b0f0c" stroke-width="1.5" stroke-linejoin="round" /><line x1="98" y1="171" x2="122" y2="171" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><polygon points="110,239 101,261 119,261" fill="#dc2626" stroke="#0b0f0c" stroke-width="1.5" stroke-linejoin="round" /><line x1="98" y1="261" x2="122" y2="261" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><polygon points="790,149 781,171 799,171" fill="#dc2626" stroke="#0b0f0c" stroke-width="1.5" stroke-linejoin="round" /><line x1="778" y1="171" x2="802" y2="171" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><polygon points="790,239 781,261 799,261" fill="#dc2626" stroke="#0b0f0c" stroke-width="1.5" stroke-linejoin="round" /><line x1="778" y1="261" x2="802" y2="261" stroke="#0b0f0c" stroke-width="2" stroke-linecap="round" /><text x="450" y="110.0" font-size="17" text-anchor="middle" font-weight="600" fill="#0b0f0c"  >🔊  Recorded beeps set the pace</text><rect x="120" y="340" width="660" height="100" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="140" y="368.0" font-size="16" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >1. Reach the line at or before each beep, then turn and run back.</text><text x="140" y="394.0" font-size="16" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >2. The beeps get closer together each level, so you run faster.</text><text x="140" y="420.0" font-size="16" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >3. Score = last level and shuttle completed before you can&#x27;t keep up (e.g. 9.5).</text>
</svg>
