<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Stork stand test</title><desc id="d">Person balancing on the ball of one foot with the other foot against the knee.</desc>
<rect width="900" height="460" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Stork stand test (balance)</text><line x1="60" y1="300" x2="840" y2="300" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><circle cx="330" cy="100" r="15" fill="#fff" stroke="#0b0f0c" stroke-width="5" /><line x1="330" y1="122" x2="330" y2="210" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" /><path d="M330,122 L290,190" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M330,122 L370,190" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M330,210 L330,260 L330,298" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M330,210 L350,240 L330,245" fill="none" stroke="#0b0f0c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><line x1="300" y1="298" x2="360" y2="298" stroke="#dc2626" stroke-width="5" stroke-linecap="round" /><text x="500" y="190.0" font-size="16" text-anchor="start" font-weight="600" fill="#0b0f0c"  >Hands on hips.</text><text x="500" y="209.2" font-size="16" text-anchor="start" font-weight="600" fill="#0b0f0c"  >One foot against the</text><text x="500" y="228.4" font-size="16" text-anchor="start" font-weight="600" fill="#0b0f0c"  >knee of the standing leg.</text><rect x="60" y="335" width="780" height="105" rx="10" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="80" y="363.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Stand on one leg. On &#x27;Go&#x27;, raise the heel of that foot off the floor and balance on the ball of the foot.</text><text x="80" y="387.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >Stop the stopwatch if the heel touches down, the hands leave the hips or the foot moves.</text><text x="80" y="411.0" font-size="15" text-anchor="start" font-weight="700" fill="#0b0f0c"  >Record the time in seconds. Repeat on the other leg. Measures: balance.</text>
</svg>
