<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Wearables and AI in performance tracking</title><desc id="d">Sensors feed data to software which produces insights, with benefits and limitations listed.</desc>
<rect width="900" height="430" fill="#fff"/>
<text x="450" y="34.0" font-size="22" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >How wearable technology and AI can support training</text><rect x="40" y="70" width="250" height="160" rx="12" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="165" y="125.0" font-size="44" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >⌚</text><text x="165" y="160.0" font-size="19" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Sensors</text><text x="165" y="186.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >heart rate, steps,</text><text x="165" y="202.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >movement, sleep</text><line x1="295" y1="150" x2="325" y2="150" stroke="#15803d" stroke-width="4" stroke-linecap="round" /><polygon points="325,150 315.1,154.8 315.1,145.2" fill="#15803d"/><rect x="330" y="70" width="250" height="160" rx="12" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="455" y="125.0" font-size="44" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >☁️</text><text x="455" y="160.0" font-size="19" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Data</text><text x="455" y="186.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >stored and</text><text x="455" y="202.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >analysed by software / AI</text><line x1="585" y1="150" x2="615" y2="150" stroke="#15803d" stroke-width="4" stroke-linecap="round" /><polygon points="615,150 605.1,154.8 605.1,145.2" fill="#15803d"/><rect x="620" y="70" width="250" height="160" rx="12" fill="#f2f5f2" stroke="#15803d" stroke-width="2" /><text x="745" y="125.0" font-size="44" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >📈</text><text x="745" y="160.0" font-size="19" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Insights</text><text x="745" y="186.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >trends, zones,</text><text x="745" y="202.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#0b0f0c"  >recovery and load</text><rect x="40" y="260" width="400" height="150" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2" /><text x="240" y="288.0" font-size="18" text-anchor="middle" font-weight="800" fill="#15803d"  >Benefits</text><text x="60" y="316.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Track progress over time</text><text x="60" y="334.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Spot signs of over-training</text><text x="60" y="352.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Personalise training</text><text x="60" y="370.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Motivation and goal tracking</text><rect x="460" y="260" width="400" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="660" y="288.0" font-size="18" text-anchor="middle" font-weight="800" fill="#dc2626"  >Limitations</text><text x="480" y="316.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Not always accurate</text><text x="480" y="334.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Data privacy and security</text><text x="480" y="352.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Can&#x27;t replace a coach or doctor</text><text x="480" y="370.0" font-size="15" text-anchor="start" font-weight="normal" fill="#0b0f0c"  >• Too much data can confuse</text>
</svg>
