<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<title id="t">Drive theory graph</title><desc id="d">A straight line rising from low to high showing performance increasing with arousal.</desc>
<rect width="900" height="460" fill="#fff"/>
<text x="450" y="34.0" font-size="24" text-anchor="middle" font-weight="800" fill="#0b0f0c"  >Drive theory</text><line x1="100" y1="380" x2="800" y2="380" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><line x1="100" y1="380" x2="100" y2="90" stroke="#0b0f0c" stroke-width="3" stroke-linecap="round" /><text x="450.0" y="424.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0b0f0c"  >Arousal / drive (low to high)</text><text transform="translate(44 235.0) rotate(-90)" font-size="17" text-anchor="middle" font-weight="700">Performance</text><line x1="100" y1="360" x2="780" y2="110" stroke="#dc2626" stroke-width="5" stroke-linecap="round" /><text x="300" y="190.0" font-size="16" text-anchor="middle" font-weight="700" fill="#dc2626"  >As arousal (drive) rises,</text><text x="300" y="209.2" font-size="16" text-anchor="middle" font-weight="700" fill="#dc2626"  >performance keeps rising</text><text x="430" y="290.0" font-size="14.5" text-anchor="middle" font-weight="600" fill="#6b7a70"  >Best for simple, well-learned skills</text><text x="430" y="307.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#6b7a70"  >and experts</text><text x="450" y="438.0" font-size="13.5" text-anchor="middle" font-weight="400" fill="#6b7a70"  >Drive theory predicts a straight-line link. Many sports psychologists prefer the inverted-U because over-arousal harms performance.</text>
</svg>
